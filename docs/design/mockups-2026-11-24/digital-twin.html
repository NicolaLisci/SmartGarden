<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0;font:14px system-ui}[hidden]{display:none!important}</style>
</head>
<body>
<title>SmartGarden Digital Twin</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,500;6..96,600&family=Jost:wght@400;500;600&display=swap">
<style>
/* Layout: the 3D garden fills the screen edge to edge; one frosted sheet floats at the bottom and changes with the selected part. */
:root{
  --bg:#E9E2D4; --bg-night:#7F786B; --ground:#D6CDBB;
  --fg:#1E2A22; --muted:#5A6557; --line:rgba(30,42,34,.16);
  --glass:rgba(250,247,240,.82); --glass-strong:rgba(250,247,240,.94);
  --sage:#7E9272; --forest:#1F3A2B; --on-forest:#F6F1E7;
  --gold:#C9962C; --midnight:#22304F; --water:#3E8FB3;
  --shadow:0 24px 60px rgba(40,34,20,.22);
  --display:"Bodoni Moda","Didot","Times New Roman",serif;
  --body:"Jost","Avenir Next","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#1B1C1E; --bg-night:#0C0D0E; --ground:#242528;
  --fg:#F1EDE4; --muted:#A9AEA2; --line:rgba(241,237,228,.18);
  --glass:rgba(34,35,38,.80); --glass-strong:rgba(34,35,38,.94);
  --sage:#9DB08F; --forest:#CFE0C3; --on-forest:#16241B;
  --gold:#E3B655; --midnight:#3B4F80; --water:#6FB8D8;
  --shadow:0 24px 60px rgba(0,0,0,.55); color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#1B1C1E; --bg-night:#0C0D0E; --ground:#242528;
  --fg:#F1EDE4; --muted:#A9AEA2; --line:rgba(241,237,228,.18);
  --glass:rgba(34,35,38,.80); --glass-strong:rgba(34,35,38,.94);
  --sage:#9DB08F; --forest:#CFE0C3; --on-forest:#16241B;
  --gold:#E3B655; --midnight:#3B4F80; --water:#6FB8D8;
  --shadow:0 24px 60px rgba(0,0,0,.55); color-scheme:dark }

html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45;overflow:hidden;font-variant-numeric:tabular-nums}
#app{position:relative;height:100%;overflow:hidden}
#scene{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#scene:active{cursor:grabbing}
#fallback{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;color:var(--muted)}

.top{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;gap:8px;
  padding-block:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));pointer-events:none}
.brand{font-family:var(--display);font-size:22px;font-weight:600;letter-spacing:-.2px}
.chip{display:inline-flex;align-items:center;gap:7px;padding:7px 12px;border-radius:999px;background:var(--glass);border:1px solid var(--line);
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);font-size:12px;font-weight:500;color:var(--fg)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--sage)}

.spot{position:absolute;left:0;top:0;display:flex;align-items:center;gap:0;transform:translate(-9999px,-9999px);border:0;background:none;padding:0;
  color:var(--fg);font:inherit;cursor:pointer;min-height:44px}
.spot i{width:12px;height:12px;border-radius:50%;background:var(--glass-strong);border:2px solid var(--forest);box-sizing:border-box;flex:none;transition:transform .35s cubic-bezier(.34,1.56,.64,1)}
.spot b{width:22px;height:1px;background:var(--forest);opacity:.55;flex:none}
.spot span{padding:6px 11px;border-radius:999px;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  font-size:12px;font-weight:500;white-space:nowrap}
.spot[aria-pressed="true"] i{transform:scale(1.5);background:var(--forest)}
.spot[aria-pressed="true"] span{background:var(--forest);color:var(--on-forest);border-color:transparent}
.spot.left{flex-direction:row-reverse}

.sheet{position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:min(100%,460px);box-sizing:border-box;max-height:54%;overflow-y:auto;
  padding:10px max(16px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  background:var(--glass);border:1px solid var(--line);border-bottom:0;border-radius:28px 28px 0 0;
  backdrop-filter:blur(28px) saturate(1.3);-webkit-backdrop-filter:blur(28px) saturate(1.3);box-shadow:var(--shadow)}
.sheet-in{display:flex;flex-direction:column;gap:14px;animation:rise .42s cubic-bezier(.22,1,.36,1)}
@keyframes rise{from{transform:translateY(10px)}to{transform:none}}
.grab{width:36px;height:4px;border-radius:2px;background:var(--line);align-self:center}
.head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.head h2{margin:0;font-family:var(--display);font-size:24px;font-weight:600;letter-spacing:-.3px;text-wrap:balance}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:1.6px;text-transform:uppercase;color:var(--muted)}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.col{display:flex;flex-direction:column;gap:4px;min-width:0}
.big{font-family:var(--display);font-size:44px;font-weight:500;line-height:1;letter-spacing:-1px}
.muted{color:var(--muted);font-size:13px}
.tag{display:inline-block;padding:2px 8px;border-radius:999px;border:1px solid var(--line);font-size:10px;font-weight:600;letter-spacing:.8px;text-transform:uppercase;color:var(--muted)}
.rule{height:1px;background:var(--line)}

button{font:inherit;color:inherit;touch-action:manipulation}
.btn{min-height:44px;padding:0 16px;border-radius:14px;border:1px solid var(--line);background:transparent;cursor:pointer;font-weight:500;
  transition:transform .3s cubic-bezier(.34,1.56,.64,1),background-color .25s ease,color .25s ease}
.btn:active{transform:scale(.96)}
.btn.primary{background:var(--forest);color:var(--on-forest);border-color:transparent}
.btn.icon{width:44px;padding:0;display:inline-flex;align-items:center;justify-content:center}
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;padding:4px;border-radius:18px;background:rgba(127,127,127,.14)}
.seg button{min-height:52px;border:0;border-radius:14px;background:transparent;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
  transition:background-color .3s ease,color .3s ease,transform .3s cubic-bezier(.34,1.56,.64,1)}
.seg button:active{transform:scale(.96)}
.seg button strong{font-weight:600;font-size:14px}
.seg button small{font-size:11px;color:var(--muted)}
.seg button[aria-checked="true"]{background:var(--forest);color:var(--on-forest)}
.seg button[aria-checked="true"] small{color:inherit;opacity:.8}
.pods{display:flex;gap:5px}
.pod{flex:1 1 0;min-width:0;max-width:48px;aspect-ratio:1;padding:0;border-radius:50%;border:1.5px dashed var(--sage);background:transparent;cursor:pointer;font-family:var(--display);font-size:18px;font-weight:600;
  transition:transform .3s cubic-bezier(.34,1.56,.64,1)}
.pod:active{transform:scale(.92)}
.pod.full{border:0;background:var(--forest);color:var(--on-forest)}
.links{display:flex;gap:8px}
.links .btn{flex:1}
label{font-size:13px;color:var(--muted)}
input[type="text"],input[type="date"]{font:inherit;color:var(--fg);min-height:44px;padding:0 12px;border-radius:12px;border:1px solid var(--line);background:transparent;width:100%;box-sizing:border-box}
input[type="range"]{width:100%;accent-color:var(--forest);min-height:32px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:14px}
.kv dt{color:var(--muted)} .kv dd{margin:0;text-align:right}
.log{margin:0;padding:0;list-style:none;font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:3px}
:focus-visible{outline:2px solid var(--forest);outline-offset:3px}
.ring-arc{transition:stroke-dasharray .9s cubic-bezier(.22,1,.36,1),transform .9s cubic-bezier(.22,1,.36,1);transform-origin:66px 66px}
.ring-hand{transition:transform .6s cubic-bezier(.22,1,.36,1);transform-origin:66px 66px}
@media (prefers-reduced-motion: reduce){ .sheet-in{animation:none} .ring-arc,.ring-hand,.btn,.seg button,.pod,.spot i{transition:none} }
</style>

<div id="app">
  <canvas id="scene" role="img" aria-label="Modello 3D della serra Duronic GHS37. Trascina per ruotare, pizzica per ingrandire."></canvas>
  <div id="fallback" hidden>Il modello 3D non è disponibile su questo dispositivo. I comandi qui sotto funzionano lo stesso.</div>
  <div class="top">
    <span class="brand">SmartGarden</span>
    <span class="chip" title="Questa pagina è un prototipo: gli stati non arrivano ancora dalla lampada"><span class="dot"></span>Prototipo · dati di esempio</span>
  </div>
  <button class="spot" id="spot-lamp" type="button" aria-pressed="false"><i></i><b></b><span>Luce</span></button>
  <button class="spot left" id="spot-tank" type="button" aria-pressed="false"><i></i><b></b><span>Vasca</span></button>
  <button class="spot" id="spot-pump" type="button" aria-pressed="false"><i></i><b></b><span>Pompa</span></button>
  <section class="sheet" id="sheet" aria-live="polite"></section>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js" integrity="sha384-CI3ELBVUz9XQO+97x6nwMDPosPR5XvsxW2ua7N1Xeygeh1IxtgqtCkGfQY9WWdHu" crossorigin="anonymous"></script>
<script>
(function () {
'use strict';
var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
var $ = function (id) { return document.getElementById(id); };
var pad = function (n) { return String(n).padStart(2, '0'); };
var esc = function (s) { return String(s).replace(/[&<>"']/g, function (c) { return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]; }); };

/* ---------- state (single source for sheet and 3D twin) ---------- */
var CYCLES = {
  normale: { name: 'Normale', hours: 14, w: 100, b: 100 },
  corto:   { name: 'Corto',   hours: 12, w: 50,  b: 0 },
  lungo:   { name: 'Lungo',   hours: 16, w: 100, b: 0 }
};
var state = {
  cycle: 'normale', start: 7, levels: { normale: [100, 100], corto: [50, 0], lungo: [100, 0] },
  pumpMode: 'auto', pumpOn: 30, pumpOff: 30,
  /* Nicola's garden, from his annotated photo: front row left to right, then back row left to right */
  pods: ['Basilico porpora', 'Basilico normale', 'Basilico lemon', 'Trinidad scorpion giallo', 'Timo', 'Maggiorana', 'Bonsai di pino'].map(function (n) { return { name: n, sown: '' }; }),
  examples: false, view: 'home', pod: 0, preview: null, manual: { w: 0, b: 0, p: 0 }, log: []
};
try { var saved = JSON.parse(localStorage.getItem('sg-twin') || 'null'); if (saved) { ['cycle', 'start', 'levels', 'pumpMode', 'pumpOn', 'pumpOff', 'pods', 'examples'].forEach(function (k) { if (k in saved && (k !== 'pods' || saved.examples === false)) state[k] = saved[k]; }); state.examples = false; } } catch (e) {}
function save() { try { localStorage.setItem('sg-twin', JSON.stringify({ cycle: state.cycle, start: state.start, levels: state.levels, pumpMode: state.pumpMode, pumpOn: state.pumpOn, pumpOff: state.pumpOff, pods: state.pods, examples: state.examples })); } catch (e) {} }
function logEvent(t) { var d = new Date(); state.log.unshift(pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds()) + '  ' + t); state.log.length = Math.min(state.log.length, 8); }

function nowMin() { if (state.preview !== null) return state.preview; var d = new Date(); return d.getHours() * 60 + d.getMinutes(); }
function derive() {
  var c = CYCLES[state.cycle], m = nowMin(), t = Date.now();
  var rel = ((m / 60 - state.start) % 24 + 24) % 24, lit = rel < c.hours;
  var lv = state.levels[state.cycle];
  var w = lit ? lv[0] : 0, b = lit ? lv[1] : 0;
  if (state.manual.w > t) w = 100; if (state.manual.b > t) b = 100;
  var period = state.pumpOn + state.pumpOff, pos = m % period;
  var pump = state.pumpMode === 'on' ? true : state.pumpMode === 'off' ? false : pos >= state.pumpOff;
  if (state.manual.p > t) pump = true;
  var toChange = Math.round((lit ? c.hours - rel : 24 - rel) * 60);
  return { c: c, m: m, lit: lit, w: w, b: b, pump: pump, toChange: toChange,
    nextAt: lit ? (state.start + c.hours) % 24 : state.start,
    pumpLeft: pump ? period - pos : state.pumpOff - pos };
}
function hm(m) { return pad(Math.floor(m / 60) % 24) + ':' + pad(m % 60); }
function dur(m) { return Math.floor(m / 60) + ' h ' + pad(m % 60) + ' min'; }

/* ---------- sheet (contextual controls) ---------- */
var sheet = $('sheet');
function ring(d) {
  var C = 326.73, deg = function (h) { return (h - 12) * 15; }, ticks = '';
  for (var i = 0; i < 24; i++) ticks += '<line x1="66" y1="' + (i % 6 ? 9 : 6) + '" x2="66" y2="12" stroke="var(--muted)" stroke-width="' + (i % 6 ? 1 : 1.6) + '" transform="rotate(' + i * 15 + ' 66 66)"/>';
  return '<svg width="132" height="132" viewBox="0 0 132 132" role="img" aria-label="Quadrante di 24 ore: luce dalle ' + pad(state.start) + ':00 per ' + d.c.hours + ' ore">' +
    ticks +
    '<circle cx="66" cy="66" r="52" fill="none" stroke="var(--midnight)" stroke-width="9"/>' +
    '<circle class="ring-arc" cx="66" cy="66" r="52" fill="none" stroke="var(--gold)" stroke-width="9" stroke-linecap="round" stroke-dasharray="' + (d.c.hours / 24 * C).toFixed(1) + ' ' + C + '" style="transform:rotate(' + (deg(state.start) - 90) + 'deg)"/>' +
    '<g class="ring-hand" style="transform:rotate(' + (d.m / 60 - 12) * 15 + 'deg)"><line x1="66" y1="66" x2="66" y2="20" stroke="var(--fg)" stroke-width="1.6" stroke-linecap="round"/><circle cx="66" cy="14" r="5" fill="var(--bg)" stroke="var(--fg)" stroke-width="1.6"/></g>' +
    '<circle cx="66" cy="66" r="3" fill="var(--fg)"/>' +
    '<text x="66" y="36" text-anchor="middle" font-size="9" fill="var(--muted)" font-family="Jost,sans-serif">12</text>' +
    '<text x="66" y="103" text-anchor="middle" font-size="9" fill="var(--muted)" font-family="Jost,sans-serif">0</text></svg>';
}
function cycleSeg() {
  return '<div class="seg" role="radiogroup" aria-label="Ciclo di luce">' + Object.keys(CYCLES).map(function (k) {
    var c = CYCLES[k]; return '<button type="button" role="radio" aria-checked="' + (k === state.cycle) + '" data-act="cycle" data-v="' + k + '"><strong>' + c.name + '</strong><small>' + c.hours + ' / ' + (24 - c.hours) + '</small></button>'; }).join('') + '</div>';
}
function startRow() {
  return '<div class="row"><span>Inizio luce</span><span class="row" style="gap:8px"><button class="btn icon" type="button" data-act="start" data-v="-1" aria-label="Un\'ora prima">−</button><strong style="font-family:var(--display);font-size:24px;width:74px;text-align:center">' + pad(state.start) + ':00</strong><button class="btn icon" type="button" data-act="start" data-v="1" aria-label="Un\'ora dopo">+</button></span></div>';
}
function header(title, eyebrow) {
  return '<div class="grab" aria-hidden="true"></div><div class="head"><div class="col"><span class="eyebrow">' + eyebrow + '</span><h2>' + title + '</h2></div><button class="btn" type="button" data-act="view" data-v="home">Chiudi</button></div>';
}
var VIEWS = {
  home: function (d) {
    return '<div class="grab" aria-hidden="true"></div>' +
      '<div class="row" style="align-items:center">' + ring(d) +
        '<div class="col" style="flex:1"><span class="eyebrow">' + (d.lit ? 'Giorno' : 'Notte') + ' · ' + d.c.name + (state.preview !== null ? ' · anteprima' : '') + '</span>' +
        '<span class="big">' + hm(d.m) + '</span>' +
        '<span>' + (d.lit ? 'Buio' : 'Luce') + ' alle ' + pad(d.nextAt) + ':00</span><span class="muted">tra ' + dur(d.toChange) + '</span>' +
        '<span class="muted">Pompa ' + (d.pump ? 'in funzione' : 'in pausa') + ' <span class="tag">comandato</span></span></div></div>' +
      cycleSeg() + startRow() +
      '<div class="rule"></div>' +
      '<div class="col"><span class="eyebrow">Piante · ' + state.pods.filter(Boolean).length + ' fori su 7' + (state.examples ? ' · esempi' : '') + '</span><div class="pods">' +
        state.pods.map(function (p, i) { return '<button type="button" class="pod' + (p ? ' full' : '') + '" data-act="pod" data-v="' + i + '" aria-label="Foro ' + (i + 1) + ': ' + (p ? esc(p.name) : 'libero') + '">' + (p ? esc(p.name.charAt(0).toUpperCase()) : '+') + '</button>'; }).join('') + '</div></div>' +
      '<div class="links"><button class="btn" type="button" data-act="view" data-v="prove">Prove</button><button class="btn" type="button" data-act="view" data-v="diag">Diagnostica</button></div>';
  },
  lamp: function (d) {
    var lv = state.levels[state.cycle];
    return header('Luce', 'Pannello LED') +
      '<div class="row"><span>' + (d.lit ? 'Accesa' : 'Spenta') + ' <span class="tag">comandato</span></span><span class="muted">' + (d.lit ? 'buio' : 'luce') + ' tra ' + dur(d.toChange) + '</span></div>' +
      cycleSeg() + startRow() +
      '<div class="col"><label for="lvW">Bianco e rosso · <span id="lvWo">' + lv[0] + '</span>%</label><input id="lvW" type="range" min="0" max="100" step="5" value="' + lv[0] + '" data-lv="0"></div>' +
      '<div class="col"><label for="lvB">Blu · <span id="lvBo">' + lv[1] + '</span>%</label><input id="lvB" type="range" min="0" max="100" step="5" value="' + lv[1] + '" data-lv="1"></div>' +
      '<span class="muted">Le intensità valgono per il ciclo ' + d.c.name + '. Il colore della luce nel modello è illustrativo.</span>';
  },
  tank: function (d) {
    return header('Vasca', 'Serbatoio') +
      '<dl class="kv"><dt>Livello acqua</dt><dd>non misurato</dd><dt>Pompa</dt><dd>' + (d.pump ? 'in funzione' : 'in pausa') + '</dd></dl>' +
      '<span class="muted">La scheda non riceve il segnale del sensore di livello: quando l\'acqua manca avvisa il cicalino della serra. Il movimento dell\'acqua nel modello è illustrativo e segue lo stato della pompa.</span>' +
      '<button class="btn" type="button" data-act="view" data-v="pump">Comandi della pompa</button>';
  },
  pump: function (d) {
    var modes = { auto: 'Automatica', on: 'Accesa', off: 'Spenta' };
    return header('Pompa', 'Circolazione') +
      '<div class="row"><span>' + (d.pump ? 'In funzione' : 'In pausa') + ' <span class="tag">comandato</span></span><span class="muted">' + (state.pumpMode === 'auto' ? (d.pump ? 'si ferma' : 'riparte') + ' tra ' + d.pumpLeft + ' min' : '') + '</span></div>' +
      '<div class="seg" role="radiogroup" aria-label="Modalità della pompa">' + Object.keys(modes).map(function (k) { return '<button type="button" role="radio" aria-checked="' + (k === state.pumpMode) + '" data-act="pmode" data-v="' + k + '"><strong>' + modes[k] + '</strong></button>'; }).join('') + '</div>' +
      '<div class="row"><span>Minuti accesa</span><span class="row" style="gap:8px"><button class="btn icon" type="button" data-act="pon" data-v="-5" aria-label="Meno">−</button><strong style="width:44px;text-align:center">' + state.pumpOn + '</strong><button class="btn icon" type="button" data-act="pon" data-v="5" aria-label="Più">+</button></span></div>' +
      '<div class="row"><span>Minuti di pausa</span><span class="row" style="gap:8px"><button class="btn icon" type="button" data-act="poff" data-v="-5" aria-label="Meno">−</button><strong style="width:44px;text-align:center">' + state.pumpOff + '</strong><button class="btn icon" type="button" data-act="poff" data-v="5" aria-label="Più">+</button></span></div>';
  },
  pod: function () {
    var p = state.pods[state.pod], days = p && p.sown ? Math.max(0, Math.floor((Date.now() - new Date(p.sown).getTime()) / 864e5)) : null;
    return header(p ? esc(p.name) : 'Foro libero', 'Foro ' + (state.pod + 1) + ' di 7') +
      (days !== null ? '<div class="row"><span class="big">' + days + '</span><span class="muted" style="flex:1">giorni dalla semina</span></div>' : '') +
      '<div class="col"><label for="podName">Cosa hai piantato</label><input id="podName" type="text" maxlength="24" autocomplete="off" placeholder="Per esempio: basilico" value="' + (p ? esc(p.name) : '') + '"></div>' +
      '<div class="col"><label for="podDate">Data di semina (facoltativa)</label><input id="podDate" type="date" value="' + (p && p.sown ? esc(p.sown) : '') + '"></div>' +
      '<div class="links"><button class="btn primary" type="button" data-act="podsave">Salva</button>' + (p ? '<button class="btn" type="button" data-act="podfree">Libera il foro</button>' : '') + '</div>' +
      '<span class="muted">La forma e la crescita della pianta nel modello sono illustrative: senza data di semina il modello mostra un germoglio.</span>';
  },
  prove: function (d) {
    var t = Date.now(), on = function (k) { return state.manual[k] > t; };
    var b = function (k, l) { return '<button class="btn' + (on(k) ? ' primary' : '') + '" type="button" data-act="manual" data-v="' + k + '" aria-pressed="' + on(k) + '">' + l + '</button>'; };
    return header('Prove', 'Collaudo') +
