<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>SmartGarden, giornata da scorrere</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#BBF7D0}a:hover{color:#DCFCE7}
button{font:inherit;cursor:pointer;touch-action:manipulation;transition:transform 180ms cubic-bezier(0.16,1,0.3,1),background-color 300ms ease,border-color 300ms ease,box-shadow 300ms ease}
button:active{transform:scale(0.95)}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #BBF7D0;outline-offset:3px}
.sg-fade{transition:opacity 600ms ease,background 700ms ease,filter 700ms ease}
.sg-cone{animation:sg-breathe 5s ease-in-out infinite}
@keyframes sg-breathe{0%,100%{filter:brightness(1)}50%{filter:brightness(1.2)}}
.sg-mote{position:absolute;width:3px;height:3px;border-radius:50%;background:#FFFFFF;animation:sg-mote 7s linear infinite}
@keyframes sg-mote{0%{transform:translate(0,0);opacity:0}15%{opacity:0.9}85%{opacity:0.7}100%{transform:translate(14px,-120px);opacity:0}}
.sg-star{position:absolute;border-radius:50%;background:#FFFFFF;animation:sg-twinkle 3.5s ease-in-out infinite}
@keyframes sg-twinkle{0%,100%{opacity:0.9}50%{opacity:0.3}}
.sg-leaf{transform-origin:bottom center;animation:sg-sway 6s ease-in-out infinite}
@keyframes sg-sway{0%,100%{transform:rotate(-1.5deg)}50%{transform:rotate(1.5deg)}}
.sg-bubble{animation:sg-bubble 2.2s ease-in infinite}
@keyframes sg-bubble{0%{transform:translateY(0);opacity:0}20%{opacity:0.9}100%{transform:translateY(-18px);opacity:0}}
.sg-range{-webkit-appearance:none;appearance:none;position:absolute;left:-12px;right:-12px;top:-17px;width:calc(100% + 24px);height:48px;margin:0;background:transparent;cursor:pointer}
.sg-range::-webkit-slider-runnable-track{height:48px;background:transparent}
.sg-range::-moz-range-track{height:48px;background:transparent}
.sg-range::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;margin-top:10px;border-radius:50%;background:#FDE047;border:3px solid #FFFFFF;box-shadow:0 0 0 6px rgba(253,224,71,0.22),0 0 24px rgba(253,224,71,0.9)}
.sg-range::-moz-range-thumb{width:24px;height:24px;border-radius:50%;background:#FDE047;border:3px solid #FFFFFF;box-shadow:0 0 0 6px rgba(253,224,71,0.22),0 0 24px rgba(253,224,71,0.9)}
@media (prefers-reduced-motion: reduce){.sg-cone,.sg-mote,.sg-star,.sg-leaf,.sg-bubble{animation:none}.sg-fade{transition:none}button:active{transform:none}}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; color: #F8FAFC; font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; font-variant-numeric: tabular-nums">

<div aria-hidden="true" class="sg-fade" style="{{sky}}"></div>
<div aria-hidden="true" class="sg-fade" style="{{starsBox}}">
<sc-for list="{{stars}}" as="s" hint-placeholder-count="30">
<span class="sg-star" style="{{s.style}}"></span>
</sc-for>
</div>

<header style="position: absolute; left: 20px; right: 20px; top: 20px; display: flex; align-items: center; justify-content: space-between; z-index: 5">
<span style="font-size: 15px; font-weight: 800">SmartGarden</span>
<span style="display: flex; align-items: center; gap: 7px; padding: 7px 12px; border-radius: 999px; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.12); font-size: 12px; font-weight: 700; color: #DCFCE7">
<span style="width: 7px; height: 7px; border-radius: 50%; background: #4ADE80; box-shadow: 0 0 8px #4ADE80"></span>{{liveLabel}}</span>
</header>

<section aria-label="{{sceneLabel}}" aria-live="polite" style="position: absolute; left: 0; right: 0; top: 0; height: 470px">
<div aria-hidden="true" style="position: absolute; left: 40px; width: 310px; top: 66px; height: 22px; border-radius: 11px; background: linear-gradient(180deg, #46536A 0%, #1A2130 100%); box-shadow: 0 2px 0 rgba(255,255,255,0.08) inset, 0 12px 34px rgba(0,0,0,0.7); z-index: 3"></div>
<div aria-hidden="true" style="position: absolute; left: 52px; width: 286px; top: 85px; height: 5px; display: flex; justify-content: space-between; z-index: 3">
<sc-for list="{{leds}}" as="d" hint-placeholder-count="15">
<span class="sg-fade" style="{{d.style}}"></span>
</sc-for>
</div>
<div aria-hidden="true" class="sg-fade" style="{{coneBox}}">
<div class="sg-cone" style="{{cone}}"></div>
<sc-for list="{{motes}}" as="p" hint-placeholder-count="14">
<span class="sg-mote" style="{{p.style}}"></span>
</sc-for>
</div>

<div style="position: absolute; left: 0; right: 0; top: 122px; display: flex; flex-direction: column; align-items: center; gap: 4px; z-index: 4">
<span class="sg-fade" style="{{phaseChip}}">{{phase}}</span>
<span style="font-size: 84px; font-weight: 800; letter-spacing: -4px; line-height: 1; text-shadow: 0 0 44px rgba(255,255,255,0.35)">{{clock}}</span>
<span style="font-size: 15px; font-weight: 600; color: rgba(255,255,255,0.92)">{{sub}}</span>
</div>

<svg aria-hidden="true" class="sg-fade" width="390" height="130" viewBox="0 0 390 130" style="{{plantsStyle}}">
<defs>
<linearGradient id="gLeaf" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#A7F3D0"></stop><stop offset="1" stop-color="#15803D"></stop></linearGradient>
<linearGradient id="gWater" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#38BDF8" stop-opacity="0.55"></stop><stop offset="1" stop-color="#0C4A6E" stop-opacity="0.15"></stop></linearGradient>
</defs>
<g class="sg-leaf"><path d="M70 100 C70 80 70 66 70 54" stroke="#16A34A" stroke-width="3" fill="none"></path><path d="M70 68 C54 64 46 50 48 38 C62 40 70 52 70 68Z" fill="url(#gLeaf)"></path><path d="M70 60 C84 54 94 42 92 30 C78 32 70 44 70 60Z" fill="url(#gLeaf)"></path></g>
<g class="sg-leaf" style="animation-delay: -2s"><path d="M145 100 C145 72 145 56 145 36" stroke="#16A34A" stroke-width="3" fill="none"></path><path d="M145 62 C125 58 116 40 120 24 C137 28 145 44 145 62Z" fill="url(#gLeaf)"></path><path d="M145 48 C164 42 175 26 171 10 C154 14 145 30 145 48Z" fill="url(#gLeaf)"></path><path d="M145 80 C130 78 122 68 122 56 C135 56 145 66 145 80Z" fill="url(#gLeaf)"></path></g>
<g class="sg-leaf" style="animation-delay: -4s"><path d="M240 100 C240 76 240 62 240 44" stroke="#16A34A" stroke-width="3" fill="none"></path><path d="M240 66 C221 62 212 46 216 30 C231 34 240 48 240 66Z" fill="url(#gLeaf)"></path><path d="M240 56 C257 50 268 34 264 18 C249 22 240 38 240 56Z" fill="url(#gLeaf)"></path></g>
<g class="sg-leaf" style="animation-delay: -1s"><path d="M318 100 C318 84 318 72 318 62" stroke="#16A34A" stroke-width="3" fill="none"></path><path d="M318 74 C303 72 297 60 299 48 C312 50 318 60 318 74Z" fill="url(#gLeaf)"></path><path d="M318 68 C331 64 339 52 337 40 C324 42 318 54 318 68Z" fill="url(#gLeaf)"></path></g>
<rect x="20" y="100" width="350" height="26" rx="9" fill="url(#gWater)"></rect>
<sc-if value="{{pumpOn}}" hint-placeholder-val="{{ true }}">
<circle class="sg-bubble" cx="90" cy="120" r="2.5" fill="#BAE6FD"></circle>
<circle class="sg-bubble" cx="175" cy="121" r="2" fill="#BAE6FD" style="animation-delay: -0.7s"></circle>
<circle class="sg-bubble" cx="262" cy="120" r="3" fill="#BAE6FD" style="animation-delay: -1.4s"></circle>
<circle class="sg-bubble" cx="335" cy="121" r="2" fill="#BAE6FD" style="animation-delay: -0.3s"></circle>
</sc-if>
</svg>
</section>

<main style="position: absolute; left: 12px; right: 12px; bottom: 12px; display: flex; flex-direction: column; gap: 16px; padding: 20px 18px 6px; border-radius: 32px; background: rgba(14,20,32,0.72); border: 1px solid rgba(255,255,255,0.12); backdrop-filter: blur(26px); box-shadow: 0 30px 60px rgba(0,0,0,0.5); z-index: 6">

<div style="display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; justify-content: space-between; align-items: baseline">
<label for="sgScrub" style="font-size: 13px; font-weight: 700; color: #E2E8F0">Scorri la giornata</label>
<sc-if value="{{isPreview}}" hint-placeholder-val="{{ false }}">
<button type="button" onClick="{{backToNow}}" style="min-height: 32px; padding: 0 10px; border-radius: 10px; border: none; background: rgba(255,255,255,0.10); color: #FDE047; font-size: 12px; font-weight: 800">Torna a adesso</button>
</sc-if>
</div>
<div style="position: relative; height: 14px; border-radius: 999px; background: rgba(255,255,255,0.08)">
<sc-for list="{{segs}}" as="g" hint-placeholder-count="1">
<div class="sg-fade" style="{{g.style}}"></div>
</sc-for>
<input id="sgScrub" class="sg-range" type="range" min="0" max="1435" step="5" value="{{min}}" onChange="{{onScrub}}" aria-valuetext="{{clock}}">
</div>
<div style="display: flex; justify-content: space-between; font-size: 11px; font-weight: 700; color: #94A3B8"><span>0</span><span>6</span><span>12</span><span>18</span><span>24</span></div>
</div>

<div role="radiogroup" aria-label="Scegli il ciclo" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
<sc-for list="{{cycles}}" as="c" hint-placeholder-count="3">
<button type="button" role="radio" aria-checked="{{c.checked}}" onClick="{{c.pick}}" style="{{c.style}}">
<span aria-hidden="true" style="{{c.swatch}}"></span>
<span style="display: flex; flex-direction: column; align-items: flex-start"><span style="font-size: 14px; font-weight: 800">{{c.name}}</span><span style="font-size: 11px; font-weight: 600; color: #CBD5E1">{{c.ratio}}</span></span>
</button>
</sc-for>
</div>

<div style="display: flex; align-items: center; justify-content: space-between">
<span style="font-size: 13px; font-weight: 700; color: #E2E8F0">Inizio luce</span>
<div style="display: flex; align-items: center; gap: 6px">
<button type="button" onClick="{{earlier}}" aria-label="Un'ora prima" style="width: 44px; height: 44px; border-radius: 14px; border: 1px solid rgba(255,255,255,0.14); background: rgba(255,255,255,0.06); color: #F8FAFC; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14"></path></svg></button>
<span style="width: 72px; text-align: center; font-size: 22px; font-weight: 800">{{startLabel}}</span>
<button type="button" onClick="{{later}}" aria-label="Un'ora dopo" style="width: 44px; height: 44px; border-radius: 14px; border: 1px solid rgba(255,255,255,0.14); background: rgba(255,255,255,0.06); color: #F8FAFC; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14M12 5v14"></path></svg></button>
</div>
</div>

<nav aria-label="Sezioni" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border-top: 1px solid rgba(255,255,255,0.08); padding-top: 4px">
<a href="#" aria-current="page" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; min-height: 52px; text-decoration: none; color: #BBF7D0; font-size: 12px; font-weight: 800">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg>Ciclo</a>
<a href="#" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; min-height: 52px; text-decoration: none; color: #94A3B8; font-size: 12px; font-weight: 600">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M9 3h6M10 3v6l-5 9a2 2 0 0 0 2 3h10a2 2 0 0 0 2-3l-5-9V3"></path></svg>Prove</a>
<a href="#" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; min-height: 52px; text-decoration: none; color: #94A3B8; font-size: 12px; font-weight: 600">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M3 12h4l3-8 4 16 3-8h4"></path></svg>Diagnostica</a>
</nav>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { picked: 'normale', start: 7, min: 860 }; }
  renderVals() {
    const NOW = 860;
    const list = [
      { id: 'normale', name: 'Normale', ratio: '14 / 10', h: 14, top: 'rgba(244,164,255,0.80)', mid: 'rgba(196,140,255,0.30)', aura: 'rgba(192,132,252,0.42)', led: ['#FFF1E0', '#F87171', '#818CF8'] },
      { id: 'corto', name: 'Corto', ratio: '12 / 12', h: 12, top: 'rgba(253,186,116,0.50)', mid: 'rgba(253,186,116,0.14)', aura: 'rgba(251,146,60,0.24)', led: ['#FED7AA', '#FCA5A5', ''] },
      { id: 'lungo', name: 'Lungo', ratio: '16 / 8', h: 16, top: 'rgba(255,190,150,0.88)', mid: 'rgba(255,140,120,0.34)', aura: 'rgba(251,113,133,0.38)', led: ['#FFF1E0', '#F87171', ''] }
    ];
    const cur = list.find((c) => c.id === this.state.picked);
    const s = this.state.start, m = this.state.min;
    const pad = (n) => String(n).padStart(2, '0');
    const hm = (mins) => pad(Math.floor(mins / 60) % 24) + ':' + pad(mins % 60);
    const rel = (((m / 60 - s) % 24) + 24) % 24;
    const lit = rel < cur.h;
    const edge = lit && (rel < 1 || rel > cur.h - 1);
    const pumpOn = (m % 60) >= 30;
    const endH = (s + cur.h) % 24;
    const toChange = lit ? Math.round((cur.h - rel) * 60) : Math.round((24 - rel) * 60);
    const dur = Math.floor(toChange / 60) + ' h ' + pad(toChange % 60);

    const stars = [];
    for (let i = 0; i < 30; i++) {
      const x = (i * 97 + 13) % 380, y = (i * 53 + 29) % 300, sz = 1 + (i % 3);
      stars.push({ style: 'left:' + x + 'px;top:' + y + 'px;width:' + sz + 'px;height:' + sz + 'px;animation-delay:-' + (i % 7) * 0.5 + 's' });
    }
    const motes = [];
    for (let i = 0; i < 14; i++) {
      const x = 90 + (i * 37) % 210, y = 160 + (i * 61) % 220;
      motes.push({ style: 'left:' + x + 'px;top:' + y + 'px;animation-delay:-' + (i * 0.55).toFixed(2) + 's;animation-duration:' + (6 + (i % 4)) + 's' });
    }
    const leds = [];
    for (let i = 0; i < 15; i++) {
      const col = cur.led[i % 3];
      const on = lit && col;
      leds.push({ style: 'width:6px;height:5px;border-radius:3px;background:' + (on ? col : '#273043') + ';' + (on ? 'box-shadow:0 0 10px ' + col : '') });
    }
    const segs = [];
    const a = s, b = s + cur.h;
    segs.push({ style: 'position:absolute;top:0;bottom:0;border-radius:999px;background:linear-gradient(90deg,#FDBA74,#FDE047 50%,#FDBA74);left:' + (a / 24 * 100).toFixed(2) + '%;width:' + ((Math.min(24, b) - a) / 24 * 100).toFixed(2) + '%' });
    if (b > 24) segs.push({ style: 'position:absolute;top:0;bottom:0;border-radius:999px;background:linear-gradient(90deg,#FDE047,#FDBA74);left:0;width:' + ((b - 24) / 24 * 100).toFixed(2) + '%' });

    const sky = lit
      ? 'radial-gradient(120% 60% at 50% 30%,' + cur.aura + ',rgba(0,0,0,0) 70%),' + (edge ? 'linear-gradient(180deg,#2A1A2E 0%,#3B2230 45%,#0B0F1E 100%)' : 'linear-gradient(180deg,#141A2E 0%,#0B1020 60%,#070A14 100%)')
      : 'radial-gradient(80% 40% at 50% 20%,rgba(99,102,241,0.18),rgba(0,0,0,0) 70%),linear-gradient(180deg,#02040B 0%,#050816 60%,#03050C 100%)';

    const base = 'display:flex;align-items:center;gap:8px;padding:10px;min-height:56px;border-radius:18px;text-align:left;color:#F8FAFC;';
    return {
      sky: 'position:absolute;inset:0;background:' + sky,
      starsBox: 'position:absolute;inset:0;opacity:' + (lit ? 0 : 1),
      stars, motes, leds, segs, pumpOn,
      coneBox: 'position:absolute;left:0;right:0;top:90px;height:340px;z-index:2;opacity:' + (lit ? 1 : 0),
      cone: 'position:absolute;inset:0;clip-path:polygon(12% 0,88% 0,100% 100%,0 100%);background:linear-gradient(180deg,' + cur.top + ' 0%,' + cur.mid + ' 50%,rgba(0,0,0,0) 100%);transition:background 700ms ease',
      plantsStyle: 'position:absolute;left:0;top:300px;z-index:3;filter:' + (lit ? 'none' : 'brightness(0.4) saturate(0.6)'),
      phase: lit ? (edge ? (rel < 1 ? 'Alba' : 'Tramonto') : 'Giorno') + ' · ' + cur.name : 'Notte · ' + cur.name,
      phaseChip: 'padding:6px 12px;border-radius:999px;font-size:12px;font-weight:800;letter-spacing:1.6px;text-transform:uppercase;background:' + (lit ? 'rgba(255,255,255,0.14)' : 'rgba(129,140,248,0.18)') + ';color:' + (lit ? '#FFFFFF' : '#C7D2FE'),
      clock: hm(m),
      sub: (lit ? 'luce fino alle ' + pad(endH) + ':00' : 'luce alle ' + pad(s) + ':00') + ' · tra ' + dur + (pumpOn ? ' · pompa attiva' : ''),
      sceneLabel: (lit ? 'Luce accesa' : 'Luce spenta') + ' alle ' + hm(m) + ', ciclo ' + cur.name + (pumpOn ? ', pompa attiva' : ', pompa in pausa'),
      liveLabel: m === NOW ? 'Dal vivo' : 'Anteprima',
      isPreview: m !== NOW,
      backToNow: () => this.setState({ min: NOW }),
      min: m,
      onScrub: (e) => this.setState({ min: Number(e.target.value) }),
      startLabel: pad(s) + ':00',
      earlier: () => this.setState({ start: (s + 23) % 24 }),
      later: () => this.setState({ start: (s + 1) % 24 }),
      cycles: list.map((c) => ({
        ...c,
        checked: c.id === cur.id ? 'true' : 'false',
        pick: () => this.setState({ picked: c.id }),
        swatch: 'flex-shrink:0;width:26px;height:18px;clip-path:polygon(22% 0,78% 0,100% 100%,0 100%);background:linear-gradient(180deg,' + c.top + ',' + c.mid + ')',
        style: base + (c.id === cur.id
          ? 'background:rgba(255,255,255,0.13);border:1.5px solid ' + c.top + ';box-shadow:0 10px 26px ' + c.aura
          : 'background:rgba(255,255,255,0.04);border:1.5px solid rgba(255,255,255,0.10)')
      }))
    };
  }
}
</script>
</body>
</html>
