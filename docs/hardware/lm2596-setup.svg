<text x="120" y="770" font-size="20" text-anchor="start" fill="#1c2227" font-weight="400">Collega l'ingresso, a corrente staccata: il filo del centro del jack su IN+, quello dell'esterno su IN−.</text>
<circle cx="84" cy="813" r="19" fill="#1f6feb" stroke="none" stroke-width="1.5"/>
<text x="84" y="820" font-size="21" text-anchor="middle" fill="#fff" font-weight="700">2</text>
<text x="120" y="820" font-size="20" text-anchor="start" fill="#1c2227" font-weight="400">Tester su tensione continua, portata 20 V: puntale rosso su OUT+, puntale nero su OUT−. Poi attacca l'alimentatore.</text>
<circle cx="84" cy="863" r="19" fill="#1f6feb" stroke="none" stroke-width="1.5"/>
<text x="84" y="870" font-size="21" text-anchor="middle" fill="#fff" font-weight="700">3</text>
<text x="120" y="870" font-size="20" text-anchor="start" fill="#1c2227" font-weight="400">Gira piano la vite del trimmer finché il tester segna 5,0 V (va bene da 4,9 a 5,2). Poi stacca l'alimentatore.</text>
<text x="84" y="928" font-size="16" text-anchor="start" fill="#5b6770" font-weight="400">Su OUT+ e OUT− non c'è collegato nulla, solo i puntali. Se il tester segna un valore negativo, i due fili d'ingresso sono invertiti: stacca e scambiali.</text>
